<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MC للعطور – MC PERFUMES</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#141414;--mu:#6b645a;--gold:#b8924a;--br:#e6dfd2;--ink:#0d0d0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121110;--card:#1c1a17;--tx:#f3eee5;--mu:#a39a8b;--br:#33302a}}
:root[data-theme=dark]{--bg:#121110;--card:#1c1a17;--tx:#f3eee5;--mu:#a39a8b;--br:#33302a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff;padding:10px 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.logo{font-weight:800;color:var(--gold);font-size:20px;letter-spacing:2px;cursor:pointer;line-height:1.1}.logo small{display:block;font-size:11px;color:#fff;letter-spacing:0;font-weight:400}
nav{display:flex;gap:14px;font-size:14px;overflow-x:auto}nav a{color:#ddd;cursor:pointer;white-space:nowrap}
.ib{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;position:relative}.bd{position:absolute;top:-6px;inset-inline-start:-8px;background:var(--gold);color:#000;border-radius:9px;font-size:11px;padding:0 5px}
#q{width:100%;margin-top:8px;padding:11px 14px;border-radius:8px;border:0;font-size:15px}
#sg{position:absolute;inset-inline:14px;background:var(--card);color:var(--tx);border-radius:8px;box-shadow:0 8px 24px #0004;z-index:9}#sg div{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--br)}
main{max-width:1100px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#0d0d0d,#2a2216);color:#fff;border-radius:14px;padding:28px 20px;text-align:center}
.hero h1{color:var(--gold);margin:0 0 8px;font-size:26px}.hero p{color:#ddd;max-width:560px;margin:0 auto 16px}
.btn{background:var(--gold);color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}.btn.o{background:none;border:1px solid var(--gold);color:var(--gold)}.btn.k{background:var(--ink);color:#fff}.btn.r{background:#b3261e;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}.feat div{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center;font-size:13px}
h2{font-size:19px;margin:22px 0 10px;border-inline-start:4px solid var(--gold);padding-inline-start:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;position:relative}
.card img.p{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee;cursor:pointer}
.nm{font-weight:700;font-size:14px}.ok{color:#2e7d32;font-size:12px;font-weight:700}.mu{color:var(--mu);font-size:12px}.pr{font-weight:800;color:var(--gold)}.fr{font-size:12px;color:#2e7d32}
.fav{position:absolute;top:14px;inset-inline-start:14px;background:#fffc;border:0;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chip{border:1px solid var(--br);background:var(--card);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}select,input,textarea{font:inherit;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
.box{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.lbl{display:block;margin:10px 0 3px;font-size:13px;font-weight:700}input.f,textarea.f{width:100%}.err{color:#b3261e;font-size:12px;min-height:16px}
.sz{display:flex;gap:6px;flex-wrap:wrap}.qt{display:inline-flex;align-items:center;gap:8px}.qt button{width:30px;height:30px;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer}
.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--br);padding:8px 0}.ci img{width:56px;height:56px;object-fit:cover;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--br);padding:6px;text-align:start;vertical-align:top}.tw{overflow-x:auto}
.pay{display:flex;gap:6px;flex-wrap:wrap}.pay label{border:1px solid var(--br);border-radius:8px;padding:8px 12px;cursor:pointer}
footer{background:var(--ink);color:#bbb;margin-top:30px;padding:22px 14px;font-size:13px}footer a{color:var(--gold);cursor:pointer;margin-inline-end:12px}
.pv{max-width:100%;max-height:220px;border-radius:8px;margin-top:6px}
.tag{display:inline-block;background:var(--br);border-radius:6px;padding:1px 8px;font-size:12px}
</style></head><body>
<header><div class="row"><div class="logo" onclick="go('')">MC<small>للعطور · MC PERFUMES</small></div><div class="sp"></div>
<button class="ib" onclick="go('favs')" title="المفضلة">♡<span class="bd" id="fc">0</span></button>
<button class="ib" onclick="go('cart')" title="السلة">🛒<span class="bd" id="cc">0</span></button></div>
<div class="row" style="margin-top:6px"><nav><a onclick="go('')">الرئيسية</a><a onclick="go('shop')">جميع العطور</a><a onclick="go('cats')">التصنيفات</a><a onclick="go('shop?sale=1')">العروض</a><a onclick="go('about')">من نحن</a><a onclick="go('contact')">تواصل معنا</a><a id="adm" onclick="go('admin')" style="display:none;color:var(--gold)">لوحة الإدارة</a></nav></div>
<input id="q" placeholder="🔍 ابحث عن عطر أو ماركة…" autocomplete="off"><div id="sg" hidden></div></header>
<main id="app"></main>
<footer><b style="color:var(--gold)">MC للعطور — MC PERFUMES</b><br>عطور أصلية في موريتانيا – التوصيل مجاني لجميع الطلبات.<br><br>
<a onclick="go('')">الرئيسية</a><a onclick="go('shop')">جميع العطور</a><a onclick="go('cats')">التصنيفات</a><a onclick="go('about')">من نحن</a><a onclick="go('contact')">تواصل معنا</a><a onclick="go('pg:privacy')">سياسة الخصوصية</a><a onclick="go('pg:terms')">الشروط والأحكام</a><a onclick="go('pg:returns')">سياسة الاستبدال والإرجاع</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CUR=" أوقية جديدة",DEF_CATS=["عطور رجالية","عطور نسائية","عطور نيش","عطور شرقية","عطور يومية","عطور المناسبات","الأكثر مبيعًا"],PAYS=["بنكيلي","مصرفي","السداد","بيم بنك"];
const S={prods:[],cats:[],orders:[],set:{pays:{},social:{},pages:{}},cart:[],favs:[],db:null,admin:false,ready:false,cat:"",f:{}};
try{S.cart=JSON.parse(localStorage.getItem("mc_cart")||"[]");S.favs=JSON.parse(localStorage.getItem("mc_fav")||"[]")}catch(e){}
const $=s=>document.querySelector(s),app=$("#app"),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const m=n=>Number(n).toLocaleString("en-US")+CUR,pid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#efe8da"/><rect x="38" y="22" width="24" height="52" rx="4" fill="#111"/><rect x="45" y="12" width="10" height="10" fill="#b8924a"/><text x="50" y="52" font-size="11" fill="#b8924a" text-anchor="middle">MC</text></svg>');
const save=()=>{try{localStorage.setItem("mc_cart",JSON.stringify(S.cart));localStorage.setItem("mc_fav",JSON.stringify(S.favs))}catch(e){}$("#cc").textContent=S.cart.reduce((a,c)=>a+c.q,0);$("#fc").textContent=S.favs.length};
const cats=()=>S.cats.length?S.cats.map(c=>c.name):DEF_CATS,vis=()=>S.prods.filter(p=>p.visible!==false);
const stk=p=>(p.sizes||[]).reduce((a,s)=>a+(+s.stock||0),0),minp=p=>Math.min(...(p.sizes||[]).map(s=>+s.price||0));
const toast=t=>alert(t),go=h=>{location.hash="#"+h;};
function card(p){const i=(p.sizes||[]).findIndex(s=>+s.stock>0),s=p.sizes[i<0?0:i]||{},av=i>=0;
return `<div class="card"><button class="fav" onclick="fav('${p.id}')">${S.favs.includes(p.id)?"♥":"♡"}</button><img class="p" src="${E((p.imgs||[])[0]||PH)}" onclick="go('p/${p.id}')" alt="">
<div class="nm">${E(p.name)}</div><div class="ok">عطر أصلي 100٪</div><div class="mu">${E(p.brand)} · ${s.ml||""} ml</div>
<div class="pr">${s.price?m(s.price):""}</div><div class="fr">التوصيل مجاني</div><div class="mu">${av?"متوفر: "+s.stock+" قطعة":"غير متوفر حاليًا"}</div>
<button class="btn" ${av?"":"disabled"} onclick="add('${p.id}',${i})">أضف إلى السلة</button><button class="btn o" onclick="go('p/${p.id}')">عرض التفاصيل</button></div>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join("")}</div>`:`<div class="box mu">لا توجد عطور لعرضها حاليًا.</div>`;
function add(id,i,q=1){const p=S.prods.find(x=>x.id==id),s=p&&p.sizes[i];if(!s)return;const l=S.cart.find(c=>c.id==id&&c.i==i),n=(l?l.q:0)+q;
if(n>+s.stock){toast("الكمية المطلوبة أكبر من المتوفر ("+s.stock+")");return}l?l.q=n:S.cart.push({id,i,q});save();toast("تمت الإضافة إلى السلة")}
function fav(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!=id):[...S.favs,id];save();route()}
function cartLines(){return S.cart.map(c=>{const p=S.prods.find(x=>x.id==c.id),s=p&&p.sizes[c.i];return p&&s?{c,p,s,t:c.q*s.price}:null}).filter(Boolean)}
const sum=()=>cartLines().reduce((a,l)=>a+l.t,0);
function filt(list,f){let a=list.filter(p=>!f.cat||p.cat==f.cat);const k=(f.q||"").trim().toLowerCase();
if(k)a=a.filter(p=>[p.name,p.brand,p.cat,...(p.sizes||[]).map(s=>s.ml+"ml")].join(" ").toLowerCase().includes(k));
if(f.brand)a=a.filter(p=>p.brand==f.brand);if(f.ml)a=a.filter(p=>p.sizes.some(s=>s.ml==f.ml));if(f.max)a=a.filter(p=>minp(p)<=+f.max);if(f.av)a=a.filter(p=>stk(p)>0);if(f.sale)a=a.filter(p=>+p.oldPrice>0);
const o=f.o||"new";return a.sort((x,y)=>o=="lo"?minp(x)-minp(y):o=="hi"?minp(y)-minp(x):o=="best"?(y.sold||0)-(x.sold||0):(y.ts||0)-(x.ts||0))}
const V={};
V.home=()=>{const P=vis();return `<div class="hero"><h1>عطرك الأصلي… عنوان تميزك</h1><p>اكتشف عالم العطور الأصلية، واختر عطرك المفضل من مجموعة متنوعة من الماركات والأحجام، مع أسعار واضحة وتوصيل مجاني لجميع الطلبات داخل موريتانيا.</p><button class="btn" onclick="go('shop')">اكتشف العطور</button> <button class="btn o" onclick="go('cats')">تصفح التصنيفات</button></div>
<div class="feat"><div>✔ عطور أصلية 100٪</div><div>📏 أحجام متعددة تناسب احتياجاتك</div><div>🏦 وسائل دفع محلية</div><div>🚚 توصيل مجاني لجميع الطلبات</div></div>
<div class="chips">${cats().map(c=>`<span class="chip" onclick="go('shop?cat='+encodeURIComponent('${E(c)}'))">${E(c)}</span>`).join("")}</div>
<h2>الأكثر مبيعًا</h2>${grid(filt(P.filter(p=>p.featured||p.best),{o:"best"}).slice(0,8))}<h2>المضافة حديثًا</h2>${grid(filt(P,{}).slice(0,8))}
<h2>العروض والخصومات</h2>${grid(filt(P,{sale:1}).slice(0,8))}<h2>العطور الكاملة</h2>${grid(P.filter(p=>p.sizes.some(s=>+s.ml>=30)).slice(0,6))}<h2>عطور مقسّمة 10 مل</h2>${grid(P.filter(p=>p.sizes.some(s=>s.ml==10)).slice(0,6))}<h2>عطور مقسّمة 5 مل</h2>${grid(P.filter(p=>p.sizes.some(s=>s.ml==5)).slice(0,6))}`};
V.cats=()=>`<h2>التصنيفات</h2><div class="grid">${cats().map(c=>`<div class="card"><div class="nm">${E(c)}</div><div class="mu">${vis().filter(p=>p.cat==c).length} عطر</div><button class="btn" onclick="go('shop?cat='+encodeURIComponent('${E(c)}'))">تصفح</button></div>`).join("")}</div>`;
V.shop=(arg)=>{const u=new URLSearchParams(arg||"");const f=S.f;if(arg!==undefined&&arg!==null){f.cat=u.get("cat")||"";f.sale=u.get("sale")||"";f.q=u.get("q")||""}
const P=vis(),br=[...new Set(P.map(p=>p.brand))],ms=[...new Set(P.flatMap(p=>p.sizes.map(s=>+s.ml)))].sort((a,b)=>a-b);
const r=filt(P,f);return `<h2>جميع العطور</h2><div class="bar"><select onchange="S.f.cat=this.value;route(1)"><option value="">كل التصنيفات</option>${cats().map(c=>`<option ${f.cat==c?"selected":""}>${E(c)}</option>`).join("")}</select>
<select onchange="S.f.brand=this.value;route(1)"><option value="">كل الماركات</option>${br.map(c=>`<option ${f.brand==c?"selected":""}>${E(c)}</option>`).join("")}</select>
<select onchange="S.f.ml=this.value;route(1)"><option value="">كل الأحجام</option>${ms.map(c=>`<option value="${c}" ${f.ml==c?"selected":""}>${c} ml</option>`).join("")}</select>
<input type="number" min="0" placeholder="أقصى سعر" value="${E(f.max||"")}" onchange="S.f.max=this.value;route(1)" style="width:110px">
<label><input type="checkbox" ${f.av?"checked":""} onchange="S.f.av=this.checked;route(1)"> المتوفر فقط</label>
<select onchange="S.f.o=this.value;route(1)"><option value="new">الأحدث</option><option value="lo" ${f.o=="lo"?"selected":""}>السعر: من الأقل</option><option value="hi" ${f.o=="hi"?"selected":""}>السعر: من الأعلى</option><option value="best" ${f.o=="best"?"selected":""}>الأكثر مبيعًا</option></select></div>${grid(r)}`};
V.favs=()=>`<h2>المفضلة</h2>${grid(vis().filter(p=>S.favs.includes(p.id)))}`;
let sel={i:0,q:1};
V.p=id=>{const p=S.prods.find(x=>x.id==id);if(!p)return `<div class="box">العطر غير موجود.</div>`;const s=p.sizes[sel.i]||p.sizes[0],av=+s.stock>0,sim=vis().filter(x=>x.id!=id&&(x.cat==p.cat||x.brand==p.brand)).slice(0,4);
return `<div class="two"><div>${(p.imgs||[PH]).map((u,k)=>`<img class="p" style="width:100%;border-radius:12px;margin-bottom:8px" src="${E(u)}">`).join("")}</div><div>
<h1 style="margin:0">${E(p.name)}</h1><div class="ok">عطر أصلي 100٪</div><div class="mu">${E(p.brand)} · ${E(p.cat||"")}</div><p>${E(p.desc||"")}</p>${p.notes?`<p><b>النوتات العطرية:</b> ${E(p.notes)}</p>`:""}
<div class="sz">${p.sizes.map((z,k)=>`<span class="chip ${k==sel.i?"on":""}" onclick="sel.i=${k};sel.q=1;route(1)">${z.ml} ml</span>`).join("")}</div>
<div class="pr" style="font-size:22px;margin-top:8px">${m(s.price)}</div><div class="fr">التوصيل مجاني</div><div class="mu">${av?"متوفر: "+s.stock+" قطعة":"غير متوفر حاليًا"}</div>
<div class="qt" style="margin:10px 0"><button onclick="sel.q=Math.max(1,sel.q-1);route(1)">−</button><b>${sel.q}</b><button onclick="sel.q=Math.min(${+s.stock||1},sel.q+1);route(1)">+</button></div><br>
<button class="btn" ${av?"":"disabled"} onclick="add('${p.id}',${sel.i},sel.q)">أضف إلى السلة</button> <button class="btn k" ${av?"":"disabled"} onclick="add('${p.id}',${sel.i},sel.q);go('checkout')">اشتر الآن</button></div></div><h2>منتجات مشابهة</h2>${grid(sim)}`};
V.cart=()=>{const L=cartLines();if(!L.length)return `<div class="box">السلة فارغة.</div>`;
return `<h2>سلة التسوق</h2><div class="box">${L.map(({c,p,s,t})=>`<div class="ci"><img src="${E((p.imgs||[])[0]||PH)}"><div class="sp"><div class="nm">${E(p.name)}</div><div class="mu">${s.ml} ml · ${m(s.price)}</div><div class="qt"><button onclick="cq('${p.id}',${c.i},-1)">−</button><b>${c.q}</b><button onclick="cq('${p.id}',${c.i},1)">+</button></div></div><b>${m(t)}</b><button class="btn r" onclick="cq('${p.id}',${c.i},-999)">🗑</button></div>`).join("")}
<p>المجموع الفرعي: <b>${m(sum())}</b><br>الخصم: 0${CUR}<br>تكلفة التوصيل: 0${CUR}<br><b>الإجمالي النهائي: ${m(sum())}</b></p><div class="fr">التوصيل مجاني لجميع الطلبات.</div><br><button class="btn" onclick="go('checkout')">إتمام الطلب</button></div>`};
function cq(id,i,d){const l=S.cart.find(c=>c.id==id&&c.i==i),p=S.prods.find(x=>x.id==id);if(!l)return;l.q+=d;if(d>0&&p&&l.q>+p.sizes[i].stock){l.q=+p.sizes[i].stock;toast("وصلت للحد الأقصى المتوفر")}if(l.q<=0)S.cart=S.cart.filter(x=>x!==l);save();route(1)}
let rc=null,pm="";
V.checkout=()=>{const L=cartLines();if(!L.length)return `<div class="box">السلة فارغة.</div>`;const pc=S.set.pays[pm]||{};
return `<h2>إتمام الطلب</h2><div class="two"><div class="box"><label class="lbl">الاسم *</label><input class="f" id="cn"><div class="err" id="e1"></div>
<label class="lbl">العنوان بالتفصيل *</label><textarea class="f" id="ca" rows="3"></textarea><div class="err" id="e2"></div>
<label class="lbl">الرقم الذي سيتم الدفع منه (8 أرقام) *</label><input class="f" id="cp" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" dir="ltr" placeholder="8 أرقام" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,8)"><div class="err" id="e3"></div>
<label class="lbl">وسيلة الدفع *</label><div class="pay">${PAYS.map(x=>`<label><input type="radio" name="pm" ${pm==x?"checked":""} onchange="pm='${x}';payInfo()"> ${x}</label>`).join("")}</div><div class="err" id="e4"></div><div id="pi"></div>
<label class="lbl">رفع وصل الدفع *</label><input type="file" id="cf" accept="image/jpeg,image/png,image/webp" onchange="pick(this)"><div id="fi" class="mu"></div><img class="pv" id="pv" hidden><div class="err" id="e5"></div></div>

const ra=async(id,a,n)=>{const{error}=await sb.rpc("admin_order",{p_id:id,p_action:a,p_note:n||""});if(error)return toast(error.message);load._s="";await load("orders");await load("products")};

async function showR(id){const o=S.orders.find(x=>x.id==id),r=await sb.storage.from("receipts").createSignedUrl(o.receipt,300);$("#rv"+id).innerHTML=r.data?`<a href="${r.data.signedUrl}" target="_blank"><img class="pv" src="${r.data.signedUrl}"></a>`:"تعذّر فتح الإيصال"}
async function loginA(){const{error}=await sb.auth.signInWithPassword({email:$("#ae").value,password:$("#ap").value});if(error)return toast("بيانات الدخول غير صحيحة");await chk()}
async function chk(){const r=await sb.rpc("is_admin");S.admin=r.data===true;$("#adm").style.display=S.admin?"":"none";if(S.admin){load("orders");clearInterval(window._o);window._o=setInterval(()=>load("orders"),20000)}route(1)}
async function logoutA(){await sb.auth.signOut();S.admin=false;$("#adm").style.display="none";route(1)}
(async()=>{save();route();["products","categories","settings"].forEach(load);await chk();setTimeout(()=>{S.ready=true;route(1)},2500)})();
</script></body></html>
