<style>
:root{--bg:#f6f2ea;--card:#fff;--tx:#16120d;--mu:#6d655a;--gold:#c6a355;--goldd:#8c6a25;--br:#e8e0d1;--ink:#111;--ok:#1f7a4d;--warn:#b4690e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ib{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;position:relative}.bd{position:absolute;top:-6px;inset-inline-start:-8px;background:var(--gold);color:#000;border-radius:9px;font-size:11px;padding:0 5px}
#q{width:100%;margin-top:8px;padding:11px 14px;border-radius:8px;border:0;font-size:15px}

main{max-width:1100px;margin:auto;padding:14px}

.hero h1{color:var(--gold);margin:0 0 8px;font-size:26px}.hero p{color:#ddd;max-width:560px;margin:0 auto 16px}
.btn{background:var(--gold);color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}.btn.o{background:none;border:1px solid var(--gold);color:var(--gold)}.btn.k{background:var(--ink);color:#fff}.btn.r{background:#b3261e;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}.feat div{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center;font-size:13px}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}select,input,textarea{font:inherit;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
.box{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:14px;margin:10px 0}
.two{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.lbl{display:block;margin:10px 0 3px;font-size:13px;font-weight:700}input.f,textarea.f{width:100%}.err{color:#b3261e;font-size:12px;min-height:16px}
.sz{display:flex;gap:6px;flex-wrap:wrap}.qt{display:inline-flex;align-items:center;gap:8px}.qt button{width:30px;height:30px;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer}
.ci{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--br);padding:8px 0}.ci img{width:56px;height:56px;object-fit:cover;border-radius:8px}

nav{gap:6px;padding:2px 0}nav a{padding:5px 12px;border-radius:20px;font-size:14px;transition:.2s}nav a:hover{background:#ffffff1a;color:#fff}nav a.on{background:var(--gold);color:#111;font-weight:700}
.an{animation:fin .4s ease both}@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.pgh+h2,.pgh+.box>h2:first-child{display:none}
.hero h1{font-size:30px;line-height:1.4}.hero{padding:40px 20px}
.card{transition:.25s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0000001a}

footer a{display:inline-block;margin-bottom:6px}

/* ---- modern look ---- */
body{background:var(--bg);-webkit-font-smoothing:antialiased}
header{background:rgba(17,17,17,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);box-shadow:0 2px 18px #0003}

nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}

.hero{background:radial-gradient(900px 320px at 85% -10%,#c6a35540,transparent 60%),radial-gradient(600px 240px at 0% 110%,#c6a35526,transparent 60%),linear-gradient(135deg,#0e0e0e,#241d12);border-radius:26px;padding:46px 22px;box-shadow:0 10px 30px #0000002e}

.feat div{border-radius:16px;box-shadow:0 1px 2px #0000000a}
.box,.card{border-radius:18px;border-color:var(--br);box-shadow:0 1px 2px #0000000a}
.card{padding:12px;gap:4px}.card:hover{box-shadow:0 12px 28px #00000018}

.nm{font-size:15px}
.pr{color:var(--goldd);font-size:17px}
.ok,.fr{color:var(--ok)}

select,input,textarea{border-radius:12px}
h2{border-inline-start:4px solid var(--gold);padding-inline-start:10px}

#sn div.er{background:#8f1d17}
.ord{padding:0}.ord>summary{padding:12px 14px;cursor:pointer;list-style:none}.ord>summary::-webkit-details-marker{display:none}
.ord>*:not(summary){margin-inline:14px}.ord[open]>summary{border-bottom:1px solid var(--br);margin-bottom:8px}.ord>*:last-child{margin-bottom:12px}
.unseen{border-inline-start:4px solid var(--gold)}.tag.new{background:#d93025;color:#fff}

/* ---- calm palette: ink + gold + warm white only ---- */
:root{--bg:#faf8f4;--card:#fff;--tx:#17181c;--mu:#6b6f76;--br:#e9e5dc;--ink:#17181c;--gold:#b08a3e;--goldd:#8a6a28;--ok:#2e7d52;--warn:#a8650f}

header{background:var(--ink)}
.logo{color:#fff}.logo small{color:#9fb6bf}

/* v6 additions */
/* حماية: لا يمكن لأي عنصر أن يجعل الصفحة أعرض من شاشة الهاتف (clip لا يعطّل الشريط العلوي الثابت) */
html,body{overflow-x:clip;max-width:100%}img,video,iframe{max-width:100%}.pay label,.ci .sp,.nm,td{overflow-wrap:anywhere}input[type=file]{max-width:100%}.two>*,.grid>*,.kpi>*,.steps>*,.bgrid>*{min-width:0}
.off{position:absolute;top:14px;inset-inline-end:14px;background:#b3261e;color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;z-index:1}
s.old{color:var(--mu);font-size:12px;font-weight:400}
.low{color:var(--warn);font-size:12px;font-weight:700}
.opx>details{background:var(--card);border:1px solid var(--br);border-radius:14px;margin:8px 0;padding:0}
.opx>details>summary{padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}.opx>details>summary::-webkit-details-marker{display:none}
.opx>details>summary:after{content:"▾";float:inline-end;color:var(--mu)}.opx>details[open]>summary{border-bottom:1px solid var(--br)}
.opx>details>div{padding:10px 14px}.opx label.ck{display:block;margin:5px 0}.opx .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
.opx .secr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px dashed var(--br);padding:6px 0}.opx .secr input[type=text]{flex:1;min-width:140px}
.savebar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--br);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 20px #0002;z-index:4}
label.ck{display:block;margin:5px 0}.lvn{font-size:12px;font-weight:700}
.vch{display:flex;align-items:flex-end;gap:2px;height:170px;padding-top:22px;margin-top:8px;border-bottom:1px solid var(--br)}
.vch>div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;position:relative;cursor:default;outline:none}
.vch>div:hover,.vch>div:focus{filter:brightness(1.15)}
.vch>div[data-l]:before{content:attr(data-l);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;font-size:11px;font-weight:700;color:var(--tx);white-space:nowrap}
.vch>div:hover:after,.vch>div:focus:after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:20px;background:var(--ink);color:#fff;padding:5px 9px;border-radius:8px;font-size:12px;white-space:nowrap;z-index:5;box-shadow:0 4px 14px #0003}
.vch>div:first-child:hover:after,.vch>div:first-child:focus:after{left:auto;right:0;transform:none}.vch>div:last-child:hover:after,.vch>div:last-child:focus:after{left:0;transform:none}
.vlx{display:flex;gap:2px;font-size:10px;color:var(--mu);margin-top:3px}.vlx span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
@media(max-width:600px){header{padding:8px 12px}#q{margin-top:6px;padding:9px 16px}.hero{padding:30px 18px}.hero h1{font-size:25px}}
a.btn{text-decoration:none;display:inline-block}@media(max-width:600px){.savebar{padding:6px;gap:6px;justify-content:center}.savebar .btn{padding:7px 10px;font-size:12px;white-space:nowrap}.savebar .sp{display:none}}.nbx{background:#d93025;color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5;display:inline-block}
/* v9 — صفحة إتمام الطلب */
.cks{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:18px 0 2px;font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",sans-serif}.cks:first-child,.ckacc+.cks{margin-top:2px}
.cks span{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.ckacc{background:#15803d12;border:1px solid #15803d40;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:8px}.ckacc a{color:var(--goldd);cursor:pointer;text-decoration:underline;margin-inline-start:4px}
.pay{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}.pay label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--br);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600;transition:.15s;background:var(--card)}

/* ================= v10 — واجهة عصرية: أسود + ذهبي + أسطح بيضاء هادئة ================= */

const ML=[5,10,30,50,75,100];
function pcHint(){const el=$("#pch");if(!el)return;const k=catKind(($("#pc")||{}).value);el.innerHTML=k=="ready"?"🟢 يظهر في «"+E(SN('ready'))+"» عندما تكتب <b>الكمية</b> لحجم واحد على الأقل. بدون كمية يظهر تلقائيًا في «"+E(SN('bar'))+"».":k=="bar"?"🟠 يظهر في «"+E(SN('bar'))+"» بزر «اطلبه الآن» (طلب مسبق). إذا كتبت كمية لاحقًا ينتقل تلقائيًا إلى «"+E(SN('ready'))+"».":"العطر يظهر في هذا التصنيف، وحالته (جاهز/باركوماند) تُحدد تلقائيًا من الكمية."}
function szRow(z){return `<div class="row" style="margin:6px 0"><input class="zo" type="number" min="1" step="any" list="mls" placeholder="الحجم بالمل (اكتب أي رقم)" style="width:140px" value="${z.ml||""}"><input class="zp" type="number" min="0" placeholder="السعر (أوقية جديدة)" style="width:150px" value="${z.price??""}"><input class="zc" type="number" min="0" placeholder="سعر التكلفة (اختياري)" style="width:150px" value="${z.cost||""}"><input class="zs" type="number" min="0" placeholder="الكمية" style="width:90px" value="${isPreS(z)?"":(z.stock??"")}" oninput="if(+this.value>0){const c=this.parentNode.querySelector('.zpr');if(c)c.checked=false}"><label class="mu"><input type="checkbox" class="zpr" ${isPreS(z)?"checked":""}> مسبق</label><button class="btn r" onclick="this.parentNode.remove()">✕</button></div>`}
const imgPath=u=>{const m=/\/object\/public\/products\/(.+)$/.exec(String(u));return m?decodeURIComponent(m[1]):null};

const needTh=()=>S.prods.filter(p=>!p.th&&(p.imgs||[]).length&&!/^data:/.test(p.imgs[0]));
function mkThumbs(){const L=needTh();if(!L.length)return;return act("جارٍ إنشاء الصور المصغرة…",async()=>{let n=0;for(let i=0;i<L.length;i++){const p=L[i];toast("صورة مصغرة "+(i+1)+" من "+L.length+"…",0,1);try{const r=await TO(fetch(p.imgs[0]),30000);if(!r.ok)continue;const t=await toImg(await r.blob(),400,.75),u=await upImg(t,p.id+"/t"+Date.now().toString(36)+(t.type=="image/webp"?".webp":".jpg"));await S.db.collection("products").doc(p.id).update({th:u});n++}catch(e){console.warn(e)}}toast("تم إنشاء "+n+" صورة مصغرة — القوائم الآن أسرع")})}
function toBlob(file,max,q,type){type=type||"image/jpeg";return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("تعذّرت قراءة الصورة"))};im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error("تعذّر ضغط الصورة")),type,q)};im.src=u})}
async function upImg(blob,path){const r=await TO(sb.storage.from("products").upload(path,blob,{contentType:blob.type||"image/jpeg",upsert:false,cacheControl:"31536000"}),90000);if(r.error)throw r.error;return sb.storage.from("products").getPublicUrl(path).data.publicUrl}
function saveP(){return act("جارٍ حفظ العطر…",async()=>{
/* الكمية المكتوبة هي المرجع: كمية ≥ 1 = جاهز للاستلام (يُلغى "مسبق")، وبدون كمية + "مسبق" = طلب مسبق باركوماند */
const sizes=[...document.querySelectorAll("#szr .row")].map(r=>{let st=Math.max(0,Math.floor(+r.querySelector(".zs").value||0));if(st>=9000)st=0;const pr=st<1&&r.querySelector(".zpr").checked;return{ml:+r.querySelector(".zo").value,pre:pr,price:+r.querySelector(".zp").value,cost:+r.querySelector(".zc").value||0,stock:pr?PREQ:st,qs:st>0}}).filter(z=>z.ml>0&&z.price>0);

function setStock(id,k,off){const qv=Math.floor(+(document.getElementById("qs_"+id+"_"+k)||{}).value||0);if(off!==0&&qv<1){toast("اكتب الكمية أولًا ثم اضغط متوفر",1);return}if(off!==0&&qv>=9000){toast("الكمية كبيرة جدًا",1);return}

/* إصلاح البيانات القديمة: أي حجم بكمية 9000+ بدون علامة "مسبق" يُعاد ضبطه كطلب مسبق صريح حتى لا يُحسب مخزونًا حقيقيًا */
function impSet(k){if(!confirm("إضافة العطور الجاهزة إلى «"+SN('bar')+"» بدون سعر؟ ستكون مخفية حتى تكتب السعر وتُظهرها."))return;return act("جارٍ استيراد العطور…",async()=>{const r=await fetch("/import-"+k+".json",{cache:"no-store"});if(!r.ok)throw new Error("ملف الاستيراد غير موجود — ارفع الملف import-"+k+".json إلى GitHub");const J=await r.json(),L=J.items||[],bc=(S.prods.find(p=>catKind(p.cat)=="bar")||{}).cat||SPD.bar;let n=0,sk=0;
